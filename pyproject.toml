[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-move"
version = "0.1.0"
description = "📦 Enterprise Move Language Static Analyzer: Resource-Oriented Programming, Sui Objects, Aptos Storage, Abilities (key/store/copy/drop), Hot Potato, Move Prover Specs & GoF 23."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
keywords = ["move", "aptos", "sui", "initia", "movement", "smart-contracts", "resource-oriented", "linear-types", "hot-potato", "witness", "static-analysis", "gof", "sarif"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
dpx-move = "pattern_detector.adapters.inbound.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/pattern_detector --cov-report=term-missing"
